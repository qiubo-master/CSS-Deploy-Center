name: Deploy Control Center

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]
  workflow_run:
    workflows: ["Control Center CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: control-center-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and push deployment image
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE: registry.cn-heyuan.aliyuncs.com/qiubo-master/css-deploy-center
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login registry.cn-heyuan.aliyuncs.com -u "$ACR_USERNAME" --password-stdin
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
      - name: Connect to deployment tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY_CURRENT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Upload release
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
        timeout-minutes: 10
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          source_archive=/tmp/control-center.tgz
          upload_dir="/tmp/control-center-upload-${GITHUB_SHA}"
          ssh_options=(
            -i ~/.ssh/deploy_key
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
            -o IPQoS=throughput
          )

          tar --exclude=.git --exclude=node_modules -czf /tmp/control-center.tgz .
          echo "待上传文件："
          du -h "$source_archive"

          echo "检查 SSH 与服务器临时目录空间"
          timeout 45s ssh "${ssh_options[@]}" -p "$PORT" "$USER@$HOST" \
            "install -d -m 700 '$upload_dir' && df -h /tmp"

          upload_with_retry() {
            local source=$1
            local destination=$2
            local label=$3
            for attempt in 1 2 3; do
              echo "上传 ${label}（第 ${attempt}/3 次）"
              if timeout 20m scp "${ssh_options[@]}" -P "$PORT" "$source" "$USER@$HOST:$destination"; then
                return 0
              fi
              echo "${label} 上传中断，15 秒后重试"
              sleep 15
            done
            echo "${label} 连续三次上传失败"
            return 1
          }

          upload_with_retry "$source_archive" "$upload_dir/control-center.tgz" "源码包"

          ssh "${ssh_options[@]}" -p "$PORT" "$USER@$HOST" \
            "mv '$upload_dir/control-center.tgz' '/tmp/control-center-${GITHUB_SHA}.tgz'"
      - name: Activate release
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          printf -v remote_acr_user '%q' "$ACR_USERNAME"
          printf '%s' "$ACR_PASSWORD" | ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p "$PORT" "$USER@$HOST" \
            "docker login registry.cn-heyuan.aliyuncs.com -u $remote_acr_user --password-stdin"
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p "$PORT" "$USER@$HOST" \
            "RELEASE_SHA=$GITHUB_SHA ARCHIVE=/tmp/control-center-${GITHUB_SHA}.tgz IMAGE_REF=registry.cn-heyuan.aliyuncs.com/qiubo-master/css-deploy-center:$GITHUB_SHA bash -s" \
            < ops/deploy-control-center.sh
      - name: Roll back release
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p "$PORT" "$USER@$HOST" "bash -s" < ops/rollback-control-center.sh
