name: Deploy Eval Platform
run-name: eval · deploy · ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha: { description: Immutable Eval commit SHA, required: true }

concurrency:
  group: eval-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { source: "langfuse/langfuse:3", target: "langfuse:3" }
          - { source: "langfuse/langfuse-worker:3", target: "langfuse-worker:3" }
          - { source: "postgres:16", target: "postgres:16" }
          - { source: "clickhouse/clickhouse-server:24", target: "clickhouse-server:24" }
          - { source: "redis:7", target: "redis:7" }
          - { source: "minio/minio:latest", target: "minio:latest" }
    steps:
      - name: Log in to Aliyun ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: printf '%s' "$ACR_PASSWORD" | docker login crpi-73ce4hnji7xum4zi.cn-heyuan.personal.cr.aliyuncs.com --username "$ACR_USERNAME" --password-stdin
      - name: Mirror dependency image
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: crpi-73ce4hnji7xum4zi.cn-heyuan.personal.cr.aliyuncs.com/qiubo-master/${{ matrix.target }}
        run: |
          if docker manifest inspect "$TARGET_IMAGE" >/dev/null 2>&1; then
            echo "ACR image already exists"
          else
            docker pull "$SOURCE_IMAGE"
            docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
            docker push "$TARGET_IMAGE"
          fi

  deploy:
    needs: mirror
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
      - name: Package production configuration
        run: tar -czf /tmp/eval-platform.tgz -C ops docker-compose.eval-production.yml
      - name: Connect to deployment tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY_CURRENT || secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Upload and activate Eval
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ inputs.target_sha }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" /tmp/eval-platform.tgz "$USER@$HOST:/tmp/eval-platform-$TARGET_SHA.tgz"
          printf '%s' "$ACR_PASSWORD" | ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            "docker login crpi-73ce4hnji7xum4zi.cn-heyuan.personal.cr.aliyuncs.com --username '$ACR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" "TARGET_SHA=$TARGET_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          root=/opt/css-deploy-center/managed/eval
          release="$root/releases/$TARGET_SHA"
          mkdir -p "$release" "$root/shared"
          tar -xzf "/tmp/eval-platform-$TARGET_SHA.tgz" -C "$release"
          mv "$release/docker-compose.eval-production.yml" "$release/docker-compose.yml"
          rm -f "/tmp/eval-platform-$TARGET_SHA.tgz"
          if [[ ! -s "$root/shared/.env" ]]; then
            umask 077
            printf 'NEXTAUTH_SECRET=%s\nLANGFUSE_SALT=%s\nENCRYPTION_KEY=%s\nPOSTGRES_PASSWORD=%s\nCLICKHOUSE_PASSWORD=%s\nREDIS_PASSWORD=%s\nMINIO_ROOT_USER=langfuse\nMINIO_ROOT_PASSWORD=%s\n' \
              "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" \
              "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > "$root/shared/.env"
          fi
          chmod 600 "$root/shared/.env"
          docker compose --env-file "$root/shared/.env" -f "$release/docker-compose.yml" pull
          docker compose --env-file "$root/shared/.env" -f "$release/docker-compose.yml" up -d --remove-orphans
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8104/api/public/health >/dev/null; then
              ln -sfn "$release" "$root/current"
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file "$root/shared/.env" -f "$release/docker-compose.yml" ps
          docker compose --env-file "$root/shared/.env" -f "$release/docker-compose.yml" logs --tail=100 langfuse-web langfuse-worker
          exit 1
          REMOTE
