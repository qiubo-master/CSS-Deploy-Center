name: Sync repositories to Aliyun ACR

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name to sync; leave empty to sync all
        required: false
        type: string
      force:
        description: Rebuild even when the commit tag already exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aliyun-acr-repository-sync
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        env:
          REPOSITORY_FILTER: ${{ inputs.repository || '' }}
        run: |
          matrix=$(jq -c --arg repository "$REPOSITORY_FILTER" \
            '{include: [.images[] | select($repository == "" or .repository == $repository)]}' \
            ops/acr-images.json)
          test "$(jq '.include | length' <<<"$matrix")" -gt 0 || {
            echo "Unknown or non-containerized repository: $REPOSITORY_FILTER"
            exit 1
          }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  sync:
    needs: catalog
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - name: Check out ${{ matrix.repository }}
        uses: actions/checkout@v4
        with:
          repository: qiubo-master/${{ matrix.repository }}
          ref: ${{ matrix.branch }}

      - name: Resolve image version
        id: version
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Aliyun ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          acr_username=$(printf '%s' "$ACR_USERNAME" | tr -d '\r\n')
          acr_password=$(printf '%s' "$ACR_PASSWORD" | tr -d '\r\n')
          echo "ACR credential lengths: username=${#acr_username}, password=${#acr_password}"
          test -n "$acr_username" && test -n "$acr_password"
          printf '%s' "$acr_password" | docker login crpi-73ce4hnji7xum4zi.cn-heyuan.personal.cr.aliyuncs.com \
            --username "$acr_username" --password-stdin

      - name: Check whether commit image already exists
        id: existing
        env:
          IMAGE: crpi-73ce4hnji7xum4zi.cn-heyuan.personal.cr.aliyuncs.com/qiubo-master/${{ matrix.image }}
          SHA: ${{ steps.version.outputs.sha }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$SHA" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$SHA already exists"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.skip != 'true'

      - name: Build and push ${{ matrix.image }}
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-73ce4hnji7xum4zi.cn-heyuan.personal.cr.aliyuncs.com/qiubo-master/${{ matrix.image }}:${{ steps.version.outputs.sha }}
            crpi-73ce4hnji7xum4zi.cn-heyuan.personal.cr.aliyuncs.com/qiubo-master/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
