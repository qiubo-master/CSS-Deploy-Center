name: css-deploy-center

services:
  control-center:
    build: .
    image: ${CONTROL_CENTER_IMAGE:-css-deploy-center:1.0.0}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    volumes:
      - /opt/css-deploy-center/shared/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
